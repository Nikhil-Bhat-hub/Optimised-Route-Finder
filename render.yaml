services:
  - type: web
    name: routewise-bengaluru
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENABLE_GRAPH_WARMUP
        value: "true"
      - key: COMPACT_GRAPH_PATH
        value: "data/bengaluru-compact.json.gz"
      - key: NOMINATIM_USER_AGENT
        value: "RoutewiseBengaluru/1.0 (https://github.com/Nikhil-Bhat-hub/Optimised-Route-Finder)"
